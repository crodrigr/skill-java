<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#374151" stroke-width="1.5"/></marker>
  </defs>
  <rect width="820" height="600" fill="#fff"/>
  <text x="410" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Las capas del proyecto — diagrama de clases</text>

  <text x="14" y="70" font-size="12" font-weight="bold" fill="#6b7280">VISTA</text>
  <text x="14" y="160" font-size="12" font-weight="bold" fill="#6b7280">CONTROLADOR</text>
  <text x="14" y="262" font-size="12" font-weight="bold" fill="#6b7280">SERVICIO</text>
  <text x="14" y="382" font-size="12" font-weight="bold" fill="#6b7280">REPOSITORIO</text>

  <rect x="290" y="44" width="240" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="64" text-anchor="middle" font-size="14" font-weight="bold">VistaConsola</text>
  <line x1="290" y1="72" x2="530" y2="72" stroke="#2563eb"/>
  <text x="300" y="89" font-size="11">pide y muestra datos</text>

  <rect x="290" y="130" width="240" height="68" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="410" y="150" text-anchor="middle" font-size="14" font-weight="bold">ControladorTareas</text>
  <line x1="290" y1="158" x2="530" y2="158" stroke="#4f46e5"/>
  <text x="300" y="175" font-size="11">- servicio: ServicioTareas</text>
  <text x="300" y="190" font-size="11">- vista: VistaConsola</text>

  <rect x="250" y="236" width="320" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="256" text-anchor="middle" font-size="14" font-weight="bold">ServicioTareas</text>
  <line x1="250" y1="264" x2="570" y2="264" stroke="#16a34a"/>
  <text x="260" y="281" font-size="11">- repositorio: RepositorioTareas</text>
  <line x1="250" y1="289" x2="570" y2="289" stroke="#16a34a"/>
  <text x="260" y="306" font-size="11">+ crear(titulo) · completar(id) · listar()</text>
  <text x="260" y="324" font-size="10" fill="#6b7280">reglas de negocio · no hace new de ningún repositorio</text>

  <rect x="250" y="376" width="320" height="86" fill="#fef9c3" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="410" y="392" text-anchor="middle" font-size="12" font-style="italic">«interface»</text>
  <text x="410" y="408" text-anchor="middle" font-size="14" font-weight="bold">RepositorioTareas</text>
  <line x1="250" y1="416" x2="570" y2="416" stroke="#d97706"/>
  <text x="260" y="434" font-size="11">+ guardar(tarea: Tarea): void</text>
  <text x="260" y="448" font-size="11">+ buscarPorId(id: int): Tarea</text>
  <text x="260" y="460" font-size="11">+ listarTodas(): List&lt;Tarea&gt;</text>

  <rect x="60" y="520" width="300" height="56" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="210" y="540" text-anchor="middle" font-size="14" font-weight="bold">RepositorioTareasMemoria</text>
  <line x1="60" y1="548" x2="360" y2="548" stroke="#7c3aed"/>
  <text x="70" y="566" font-size="11">Map en memoria (se pierde al cerrar)</text>

  <rect x="460" y="520" width="300" height="56" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="610" y="540" text-anchor="middle" font-size="14" font-weight="bold">RepositorioTareasArchivo</text>
  <line x1="460" y1="548" x2="760" y2="548" stroke="#7c3aed"/>
  <text x="470" y="566" font-size="11">archivo tareas.txt (persiste)</text>

  <rect x="620" y="262" width="170" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="705" y="282" text-anchor="middle" font-size="14" font-weight="bold">Tarea</text>
  <line x1="620" y1="290" x2="790" y2="290" stroke="#dc2626"/>
  <text x="630" y="308" font-size="11">id, titulo, completada</text>

  <rect x="620" y="130" width="170" height="68" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="705" y="150" text-anchor="middle" font-size="14" font-weight="bold">Principal (main)</text>
  <line x1="620" y1="158" x2="790" y2="158" stroke="#6b7280"/>
  <text x="630" y="175" font-size="11">crea el repositorio y</text>
  <text x="630" y="190" font-size="11">lo inyecta (ensambla)</text>

  <line x1="410" y1="96" x2="410" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="198" x2="410" y2="234" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="336" x2="410" y2="374" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="361" font-size="11" fill="#b91c1c" font-weight="bold">depende de la INTERFAZ</text>
  <path d="M210 520 L210 492 L340 492 L340 464" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#t)"/>
  <path d="M610 520 L610 492 L480 492 L480 464" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#t)"/>
  <text x="410" y="486" text-anchor="middle" font-size="11">implements</text>
  <path d="M705 198 L705 214 L540 214 L540 234" fill="none" stroke="#374151" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="620" y="208" font-size="10" fill="#6b7280">inyecta</text>
  <line x1="570" y1="292" x2="618" y2="292" stroke="#374151" stroke-dasharray="3 3" marker-end="url(#a)"/>
</svg>
