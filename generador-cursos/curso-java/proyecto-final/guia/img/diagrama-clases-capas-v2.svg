<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#374151" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fff"/>
  <text x="470" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Las capas del proyecto — tres capas y un modelo transversal</text>

  <!-- Franjas de capas -->
  <rect x="8" y="38" width="792" height="176" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="20" y="60" font-size="12" font-weight="bold" fill="#1d4ed8">1 · CAPA DE PRESENTACIÓN</text>
  <text x="20" y="76" font-size="10" fill="#6b7280">paquete presentacion · vista + controlador</text>
  <rect x="8" y="222" width="792" height="124" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="20" y="244" font-size="12" font-weight="bold" fill="#15803d">2 · CAPA DE NEGOCIO</text>
  <text x="20" y="260" font-size="10" fill="#6b7280">paquete negocio · servicio</text>
  <rect x="8" y="352" width="792" height="352" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="20" y="376" font-size="12" font-weight="bold" fill="#6d28d9">3 · CAPA DE PERSISTENCIA</text>
  <text x="20" y="392" font-size="10" fill="#6b7280">paquete persistence · repositorio + DAO</text>

  <!-- Columna fuera de las capas -->
  <text x="840" y="52" font-size="12" font-weight="bold" fill="#6b7280">FUERA DE LAS CAPAS</text>

  <!-- Presentación -->
  <rect x="290" y="44" width="240" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="64" text-anchor="middle" font-size="14" font-weight="bold">VistaConsola</text>
  <line x1="290" y1="72" x2="530" y2="72" stroke="#2563eb"/>
  <text x="300" y="89" font-size="11">pide y muestra datos</text>

  <rect x="290" y="130" width="240" height="68" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="410" y="150" text-anchor="middle" font-size="14" font-weight="bold">ControladorTareas</text>
  <line x1="290" y1="158" x2="530" y2="158" stroke="#4f46e5"/>
  <text x="300" y="175" font-size="11">- servicio: ServicioTareas</text>
  <text x="300" y="190" font-size="11">- vista: VistaConsola</text>

  <!-- Negocio -->
  <rect x="250" y="236" width="320" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="256" text-anchor="middle" font-size="14" font-weight="bold">ServicioTareas</text>
  <line x1="250" y1="264" x2="570" y2="264" stroke="#16a34a"/>
  <text x="260" y="281" font-size="11">- repositorio: RepositorioTareas</text>
  <line x1="250" y1="289" x2="570" y2="289" stroke="#16a34a"/>
  <text x="260" y="306" font-size="11">+ crear(titulo) · completar(id) · listar()</text>
  <text x="260" y="324" font-size="10" fill="#6b7280">reglas de negocio · no hace new de ningún repositorio</text>

  <!-- Persistencia -->
  <rect x="250" y="376" width="320" height="94" fill="#fef9c3" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="410" y="392" text-anchor="middle" font-size="12" font-style="italic">«interface»</text>
  <text x="410" y="408" text-anchor="middle" font-size="14" font-weight="bold">RepositorioTareas</text>
  <line x1="250" y1="416" x2="570" y2="416" stroke="#d97706"/>
  <text x="260" y="434" font-size="11">+ guardar(tarea: Tarea): void</text>
  <text x="260" y="448" font-size="11">+ buscarPorId(id: int): Tarea</text>
  <text x="260" y="460" font-size="11">+ listarTodas(): List&lt;Tarea&gt;</text>

  <rect x="40" y="520" width="230" height="56" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="155" y="540" text-anchor="middle" font-size="13" font-weight="bold">RepositorioTareasMemoria</text>
  <line x1="40" y1="548" x2="270" y2="548" stroke="#7c3aed"/>
  <text x="50" y="566" font-size="11">Map en memoria (se pierde)</text>

  <rect x="290" y="520" width="230" height="56" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="405" y="540" text-anchor="middle" font-size="13" font-weight="bold">RepositorioTareasArchivo</text>
  <line x1="290" y1="548" x2="520" y2="548" stroke="#7c3aed"/>
  <text x="300" y="566" font-size="11">archivo tareas.txt (persiste)</text>

  <rect x="540" y="520" width="230" height="56" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="655" y="540" text-anchor="middle" font-size="13" font-weight="bold">RepositorioTareasMySQL</text>
  <line x1="540" y1="548" x2="770" y2="548" stroke="#7c3aed"/>
  <text x="550" y="566" font-size="11">delega en el DAO</text>

  <rect x="540" y="624" width="230" height="60" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="655" y="644" text-anchor="middle" font-size="14" font-weight="bold">TareaDAO</text>
  <line x1="540" y1="652" x2="770" y2="652" stroke="#0d9488"/>
  <text x="550" y="670" font-size="11">SQL / JDBC (tabla tarea)</text>

  <!-- Fuera de las capas: Principal y Tarea -->
  <rect x="840" y="64" width="220" height="76" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="950" y="84" text-anchor="middle" font-size="14" font-weight="bold">Principal (main)</text>
  <line x1="840" y1="92" x2="1060" y2="92" stroke="#6b7280"/>
  <text x="850" y="109" font-size="11">raíz de composición: crea las</text>
  <text x="850" y="124" font-size="11">piezas y las inyecta (ensambla)</text>

  <text x="840" y="254" font-size="12" font-weight="bold" fill="#6b7280">MODELO · transversal</text>
  <rect x="840" y="262" width="220" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="950" y="282" text-anchor="middle" font-size="14" font-weight="bold">Tarea</text>
  <line x1="840" y1="290" x2="1060" y2="290" stroke="#dc2626"/>
  <text x="850" y="308" font-size="11">id, titulo, completada</text>
  <text x="840" y="340" font-size="10" fill="#6b7280">paquete model · lo usan las tres capas</text>

  <!-- Dependencias entre capas -->
  <line x1="410" y1="130" x2="410" y2="98" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="118" font-size="11">usa</text>
  <line x1="410" y1="198" x2="410" y2="234" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="336" x2="410" y2="374" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="346" font-size="11" fill="#b91c1c" font-weight="bold">depende de la INTERFAZ</text>

  <!-- implements -->
  <path d="M155 520 L155 492 L300 492 L300 472" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#t)"/>
  <line x1="405" y1="520" x2="405" y2="472" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#t)"/>
  <path d="M655 520 L655 492 L520 492 L520 472" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#t)"/>
  <text x="415" y="506" font-size="11">implements</text>
  <line x1="655" y1="576" x2="655" y2="622" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="665" y="604" font-size="11">usa</text>

  <!-- Servicio crea Tarea -->
  <line x1="570" y1="292" x2="838" y2="292" stroke="#374151" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="650" y="286" font-size="10" fill="#6b7280">crea / usa</text>

  <!-- Principal ensambla -->
  <path d="M840 80 L610 80 L610 150 L532 150" fill="none" stroke="#374151" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="620" y="74" font-size="10" fill="#6b7280">crea controlador y vista</text>
  <path d="M950 140 L950 226 L540 226 L540 234" fill="none" stroke="#374151" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="640" y="220" font-size="10" fill="#6b7280">inyecta repositorio</text>
  <path d="M1060 102 L1090 102 L1090 548 L772 548" fill="none" stroke="#374151" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="840" y="500" font-size="10" fill="#6b7280">crea una de las tres</text>
  <text x="840" y="512" font-size="10" fill="#6b7280">implementaciones (y el DAO)</text>
</svg>
